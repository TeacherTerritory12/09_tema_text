<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вебквест: Опрацювання текстових даних (9 клас)</title>
    <style>
        :root {
            --bg-main: #0f172a;       /* Глибокий темно-синій */
            --card-bg: #1e293b;       /* Трохи світліший синій для карток */
            --primary: #38bdf8;       /* Яскравий блакитний акцент */
            --primary-hover: #0ea5e9;
            --text-color: #f1f5f9;    /* Світлий текст */
            --text-muted: #94a3b8;    /* Приглушений текст */
            --border-color: #334155;  /* Межі */
            --success: #22c55e;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Екран входу */
        #login-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .error-msg {
            color: var(--error);
            font-size: 12px;
            min-height: 15px;
        }

        /* Прогрес бар */
        .progress-container {
            width: 100%;
            background-color: var(--border-color);
            border-radius: 8px;
            height: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
            color: var(--text-color);
        }

        .hint {
            font-size: 13px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }

        .option-item {
            background: #0f172a;
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
        }

        .option-item:hover {
            background: #1e293b;
            border-color: #475569;
        }

        .option-item.selected {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .quiz-section, .results {
            display: none;
        }

        .results {
            text-align: center;
        }

        .results h2 {
            color: var(--primary);
            font-size: 26px;
        }

        .score-badge {
            font-size: 42px;
            font-weight: bold;
            color: var(--primary);
            margin: 15px 0;
        }

        .student-name-display {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Стилі для детального звіту */
        .report-container {
            text-align: left;
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .report-item {
            background: #0f172a;
            border-left: 5px solid var(--border-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .report-item.correct {
            border-left-color: var(--success);
        }

        .report-item.incorrect {
            border-left-color: var(--error);
        }

        .report-q-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .report-details {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .tag-correct {
            color: var(--success);
            font-weight: 600;
        }

        .tag-error {
            color: var(--error);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Квест: Опрацювання текстових даних</h1>
    <div class="subtitle">Й. Ривкінд, НУШ 9 клас</div>

    <!-- Екран реєстрації (Введення ПІБ) -->
    <div id="login-screen">
        <div class="form-group">
            <label for="student-name">Введіть ваше Прізвище та Ім'я (українською мовою):</label>
            <input type="text" id="student-name" placeholder="Наприклад: Шевченко Тарас">
            <div id="name-error" class="error-msg"></div>
        </div>
        <button class="btn" onclick="startQuiz()">Розпочати квест</button>
    </div>

    <!-- Екран квесту -->
    <div id="quiz-container" class="quiz-section">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="info-bar">
            <span id="question-counter">Запитання 1 з 10</span>
            <span id="student-greeting"></span>
        </div>

        <div id="question-box" class="question-box"></div>
        <div class="hint">⚠️ Увага: у кожному питанні рівно ДВІ правильні відповіді! Позначте їх обидві.</div>

        <ul id="options-container" class="options-list"></ul>

        <button id="next-btn" class="btn" onclick="handleNextButton()">Далі</button>
    </div>

    <!-- Екран результатів -->
    <div id="results-container" class="results">
        <h2>Результати тестування</h2>
        <div class="student-name-display" id="result-name"></div>
        <div class="score-badge" id="final-score">0 / 10</div>
        <p id="grade-text" style="font-size: 18px; margin-bottom: 15px;"></p>
        
        <div style="font-weight: bold; margin-bottom: 10px; color: var(--text-muted);">Детальний звіт по відповідях:</div>
        <div class="report-container" id="report-container"></div>

        <button class="btn" style="margin-top: 20px;" onclick="location.reload()">Пройти знову</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Що є характерними ознаками та властивостями абзацу в текстовому процесорі Word?",
            options: [
                { text: "Фрагмент тексту, що завершується натисканням клавіші Enter.", correct: true },
                { text: "Має власні параметри вирівнювання, відступів та міжрядкового інтервалу.", correct: true },
                { text: "Будь-який текст, що обов'язково закінчується крапкою.", correct: false },
                { text: "Сукупність символів, які не можна форматувати окремо від інших абзаців.", correct: false }
            ]
        },
        {
            question: "Які твердження щодо стилів оформлення в текстовому документі є правильними?",
            options: [
                { text: "Застосування стилів дозволяє швидко змінити оформлення всього документа або його частин.", correct: true },
                { text: "Стиль може містити параметри шрифту, абзацу та кольору.", correct: true },
                { text: "Стилі можна використовувати лише для створення списків.", correct: false },
                { text: "Змінити вбудований стиль у програмі принципово неможливо.", correct: false }
            ]
        },
        {
            question: "Які твердження щодо створення списків у текстовому редакторі є правильними?",
            options: [
                { text: "Порядок елементів має важливе значення у нумерованих списках.", correct: true },
                { text: "Маркери списку можна налаштовувати, використовуючи власні символи чи малюнки.", correct: true },
                { text: "Нумерований список неможливо перетворити на маркований.", correct: false },
                { text: "Відступи списку не можна регулювати за допомогою лінійки.", correct: false }
            ]
        },
        {
            question: "Для чого призначені колонтитули в текстовому документі?",
            options: [
                { text: "Для розміщення номери сторінок або назви документа на кожній сторінці.", correct: true },
                { text: "Для розміщення тексту або графіки, що повторюються у верхньому чи нижньому полях.", correct: true },
                { text: "Для автоматичного створення змісту документа.", correct: false },
                { text: "Для блокування можливості редагування тексту.", correct: false }
            ]
        },
        {
            question: "Які наслідки можуть бути під час роботи з таблицями у текстовому редакторі?",
            options: [
                { text: "При виділенні рядка і натисканні клавіші Delete видаляється лише вміст клітинок, а структура залишається.", correct: true },
                { text: "Таблицю можна розділити на дві частини або об'єднати з іншою.", correct: true },
                { text: "Натискання Delete на виділеному рядку завжди повністю видаляє рядок із документа.", correct: false },
                { text: "Додати новий стовпець до вже готової таблиці неможливо.", correct: false }
            ]
        },
        {
            question: "Які засоби використовуються для створення структури та навігації в документі?",
            options: [
                { text: "Зміст (автоматичне створення на основі стилів заголовків).", correct: true },
                { text: "Область навігації або схема документа.", correct: true },
                { text: "Автоматична нумерація окремих слів у тексті.", correct: false },
                { text: "Шаблони сторінок формату A4.", correct: false }
            ]
        },
        {
            question: "Виберіть правильні твердження про роботу з багаторівневими списками:",
            options: [
                { text: "Багаторівневий список містить ієрархічну структуру (пункти та підпункти).", correct: true },
                { text: "Може містити комбінацію маркерів і цифр для різних рівнів ієрархії.", correct: true },
                { text: "У багаторівневому списку може бути лише два рівні вкладеності.", correct: false },
                { text: "Створити такий список можна виключно вручну за допомогою пробілів.", correct: false }
            ]
        },
        {
            question: "Які елементи можна вставити до текстового документа через вкладку «Вставлення» (Insert)?",
            options: [
                { text: "Гіперпосилання.", correct: true },
                { text: "Колонтитули та номери сторінок.", correct: true },
                { text: "Новий власний абзацний стиль за замовчуванням.", correct: false },
                { text: "Параметри розміру паперу (наприклад, А3 чи А4).", correct: false }
            ]
        },
        {
            question: "Які елементи структури таблиці відповідають правильним визначенням?",
            options: [
                { text: "Клітинка — область на перетині стовпця і рядка для введення даних.", correct: true },
                { text: "Рядок — сукупність клітинок, розташованих горизонтально.", correct: true },
                { text: "Стовпець — сукупність клітинок, розташованих горизонтально.", correct: false },
                { text: "Клітинка — увесь текст, що знаходиться всередині таблиці.", correct: false }
            ]
        },
        {
            question: "Які дії входять до процесу створення власного стилю абзацу?",
            options: [
                { text: "Задання унікальної назви стилю.", correct: true },
                { text: "Налаштування параметрів шрифту, міжрядкового інтервалу та вирівнювання.", correct: true },
                { text: "Обов'язкове завантаження файлу стилю з інтернету.", correct: false },
                { text: "Зміна розширення текстового документа з .docx на .style.", correct: false }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let studentFullName = "";
    let userAnswersLog = []; // Масив для збереження відповідей учня

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Перемішуємо питання і варіанти перед початком
    shuffle(questions);
    questions.forEach(q => shuffle(q.options));

    function startQuiz() {
        const nameInput = document.getElementById("student-name");
        const errorDiv = document.getElementById("name-error");
        const rawValue = nameInput.value.trim();

        const ukrainianNameRegex = /^[А-ЩЬЮЯҐЄІЇA-ЩЬЮЯҐЄІЇа-щьюяґєї']+(\s+[А-ЩЬЮЯҐЄІЇа-щьюяґєї'-]+)+$/;

        if (!ukrainianNameRegex.test(rawValue)) {
            errorDiv.innerText = "Будь ласка, введіть коректно Прізвище та Ім'я українською мовою (мінімум два слова).";
            return;
        }

        errorDiv.innerText = "";
        studentFullName = rawValue;

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";
        document.getElementById("student-greeting").innerText = studentFullName;

        loadQuestion();
    }

    function loadQuestion() {
        const currentQ = questions[currentQuestionIndex];
        
        document.getElementById("question-counter").innerText = `Запитання ${currentQuestionIndex + 1} з ${questions.length}`;
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById("progress-bar").style.width = `${progressPercent}%`;

        document.getElementById("question-box").innerText = currentQ.question;
        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentQ.options.forEach((option, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerHTML = `
                <input type="checkbox" id="opt-${index}" value="${index}">
                <label for="opt-${index}" style="cursor: pointer; width: 100%;">${option.text}</label>
            `;
            
            li.addEventListener("click", (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const checkbox = li.querySelector("input");
                    checkbox.checked = !checkbox.checked;
                }
                li.classList.toggle("selected", li.querySelector("input").checked);
            });

            optionsContainer.appendChild(li);
        });
    }

    function handleNextButton() {
        const currentQ = questions[currentQuestionIndex];
        const checkboxes = document.querySelectorAll("#options-container input[type='checkbox']");
        
        let userChoicesIndices = [];
        let userChoicesTexts = [];
        checkboxes.forEach((cb, idx) => {
            if (cb.checked) {
                userChoicesIndices.push(idx);
                userChoicesTexts.push(currentQ.options[idx].text);
            }
        });

        if (userChoicesIndices.length !== 2) {
            alert("Будь ласка, оберіть рівно ДВІ відповіді!");
            return;
        }

        let correctIndices = [];
        let correctTexts = [];
        currentQ.options.forEach((opt, idx) => {
            if (opt.correct) {
                correctIndices.push(idx);
                correctTexts.push(opt.text);
            }
        });

        const isCorrect = userChoicesIndices.every(val => correctIndices.includes(val)) && 
                          userChoicesIndices.length === correctIndices.length;

        if (isCorrect) {
            score++;
        }

        // Зберігаємо лог відповіді для фінального звіту
        userAnswersLog.push({
            question: currentQ.question,
            userChoices: userChoicesTexts,
            correctChoices: correctTexts,
            isCorrect: isCorrect
        });

        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("results-container").style.display = "block";
        
        document.getElementById("result-name").innerText = studentFullName;
        document.getElementById("final-score").innerText = `${score} / ${questions.length}`;

        let grade12 = Math.round((score / questions.length) * 12);
        if (grade12 < 1 && score > 0) grade12 = 1;
        document.getElementById("grade-text").innerText = `Оцінка за тестування: ${grade12} балів (з 12)`;

        // Формуємо детальний звіт
        const reportContainer = document.getElementById("report-container");
        reportContainer.innerHTML = "";

        userAnswersLog.forEach((item, index) => {
            const reportItem = document.createElement("div");
            reportItem.className = `report-item ${item.isCorrect ? 'correct' : 'incorrect'}`;
            
            reportItem.innerHTML = `
                <div class="report-q-title">${index + 1}. ${item.question}</div>
                <div class="report-details">
                    Статус: <span class="${item.isCorrect ? 'tag-correct' : 'tag-error'}">${item.isCorrect ? 'Правильно ✓' : 'Помилка ✗'}</span><br>
                    <strong>Ваші відповіді:</strong> ${item.userChoices.join('; ')}<br>
                    <strong>Правильні відповіді:</strong> ${item.correctChoices.join('; ')}
                </div>
            `;
            reportContainer.appendChild(reportItem);
        });
    }
</script>

</body>
</html>
